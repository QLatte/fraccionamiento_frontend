<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#123c4a"/>
    <meta name="description" content="Crea pases de visita, comparte el QR y administra el acceso a tu vivienda con SICA."/>
    <meta name="referrer" content="no-referrer"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
    <link rel="apple-touch-icon" href="/icon-192.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <link rel="stylesheet" href="/loading.css"/>
    <title>SICA | Acceso a tu comunidad</title>
  </head>
  <body>
    <div id="sica-startup" class="sica-loading-screen" role="status" aria-live="polite" aria-atomic="true">
      <div class="sica-loading-card">
        <span class="sica-loading-brand">SICA</span>
        <span class="sica-loader sica-loader--screen" aria-hidden="true">
          <span class="sica-loader-rotor">
              <span class="sica-loader-segment" style="--segment:0"></span>
              <span class="sica-loader-segment" style="--segment:1"></span>
              <span class="sica-loader-segment" style="--segment:2"></span>
              <span class="sica-loader-segment" style="--segment:3"></span>
              <span class="sica-loader-segment" style="--segment:4"></span>
              <span class="sica-loader-segment" style="--segment:5"></span>
              <span class="sica-loader-segment" style="--segment:6"></span>
              <span class="sica-loader-segment" style="--segment:7"></span>
              <span class="sica-loader-segment" style="--segment:8"></span>
              <span class="sica-loader-segment" style="--segment:9"></span>
              <span class="sica-loader-segment" style="--segment:10"></span>
              <span class="sica-loader-segment" style="--segment:11"></span>
          </span>
          <span class="sica-loader-mark">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/>
              <path d="m8 12 3 3 5-6"/>
            </svg>
          </span>
        </span>
        <p class="sica-loading-label">Abriendo SICA</p>
        <p class="sica-loading-detail">Preparando el acceso a tu comunidad.</p>
        <noscript><p>Activa JavaScript en tu navegador para usar SICA.</p></noscript>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
