<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
    <meta name="theme-color" content="#ffffff"/>
    <meta name="description" content="Crea pases de visita, comparte el QR y administra el acceso a tu vivienda con Zentry."/>
    <meta name="referrer" content="no-referrer"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <link rel="icon" type="image/svg+xml" href="/icon.svg"/>
    <link rel="apple-touch-icon" href="/icon-192.png"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    <title>Zentry | Acceso a tu comunidad</title>
    <!-- Before the app's code arrives, paint the splash's petrol instead of a white flash (same rule as shouldShowSplash). -->
    <style>html.boot-splash { background: #123c4a; }</style>
    <script>try { if (!location.pathname.startsWith('/p/') && !sessionStorage.getItem('zentry:splash-shown')) document.documentElement.classList.add('boot-splash'); } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
